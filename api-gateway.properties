spring.application.name=api-gateway

server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=savings-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://SAVINGS-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/savings/**

spring.cloud.gateway.server.webmvc.routes[1].id=transaction-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://TRANSACTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/transactions/**

spring.cloud.gateway.server.webmvc.routes[2].id=auth-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://SAVINGS-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/auth/**
